services:
  # 1. ElysiaJS API Backend
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: porto-api
    restart: unless-stopped
    ports:
      - "3002:3002"
    volumes:
      # Data persistence for content.json & credentials.json
      - porto-api-data:/app/apps/api/data
    environment:
      - PORT=3002
      - NODE_ENV=production
    networks:
      - porto-network

  # 2. SvelteKit Web Portfolio (Visitor)
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: porto-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - HOST=0.0.0.0
      - NODE_ENV=production
    depends_on:
      - api
    networks:
      - porto-network

  # 3. SvelteKit Admin Dashboard
  admin:
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
    container_name: porto-admin
    restart: unless-stopped
    ports:
      - "5174:3001"
    environment:
      - PORT=3001
      - HOST=0.0.0.0
      - NODE_ENV=production
    depends_on:
      - api
    networks:
      - porto-network

  # 4. Nginx Reverse Proxy (Gateway Port 80)
  nginx:
    image: nginx:alpine
    container_name: porto-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web
      - api
      - admin
    networks:
      - porto-network

networks:
  porto-network:
    driver: bridge

volumes:
  porto-api-data:
    driver: local

